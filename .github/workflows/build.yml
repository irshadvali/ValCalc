
name: Android Build and Google Play Upload

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android AAB and Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install EAS CLI
      - name: Install EAS CLI
        run: npm install --global eas-cli

      # 5. Authenticate with Expo
      - name: Expo Login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is missing"
            exit 1
          fi

          eas whoami

      # 6. Build Android AAB using EAS
      - name: Build Android AAB
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

      # 7. Download generated AAB
      - name: Download Android AAB
        run: |
          mkdir -p artifacts

          eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive > artifacts/build-list.json

          BUILD_ID=$(node -e "
            const builds = require('./artifacts/build-list.json');
            if (!builds.length || !builds[0].artifacts?.applicationArchiveUrl) {
              throw new Error('No completed Android AAB build found');
            }
            console.log(builds[0].id);
          ")

          AAB_URL=$(node -e "
            const builds = require('./artifacts/build-list.json');
            console.log(builds[0].artifacts.applicationArchiveUrl);
          ")

          curl -fL "$AAB_URL" -o artifacts/app-release.aab

          test -s artifacts/app-release.aab

          echo "Downloaded build: $BUILD_ID"
          ls -lh artifacts/app-release.aab

      # 8. Save AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: artifacts/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # 9. Upload to Google Play Internal Testing
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.irshadvali.valcalc
          releaseFiles: artifacts/app-release.aab
          track: internal
          status: completed
