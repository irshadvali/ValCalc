
name: Android Build and Google Play Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android AAB and Upload to Play Store
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Generate Android project if missing
      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then
            npx expo prebuild --platform android --no-install
          fi

      # 6. Configure Android signing
      - name: Configure and Verify Android Signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ANDROID_DIR="$GITHUB_WORKSPACE/android"
          PROPERTIES="$ANDROID_DIR/gradle.properties"
          KEYSTORE_FILE="$ANDROID_DIR/app/upload-keystore.jks"

          echo "Checking Android project..."

          if [[ ! -d "$ANDROID_DIR" ]]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          if [[ ! -f "$ANDROID_DIR/app/build.gradle" ]]; then
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

          # Validate GitHub Secrets
          [[ -n "$KEYSTORE" ]] || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          }

          [[ -n "$STORE_PASSWORD" ]] || {
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is empty."
            exit 1
          }

          [[ -n "$KEY_ALIAS" ]] || {
            echo "ERROR: ANDROID_KEY_ALIAS secret is empty."
            exit 1
          }

          [[ -n "$KEY_PASSWORD" ]] || {
            echo "ERROR: ANDROID_KEY_PASSWORD secret is empty."
            exit 1
          }

          mkdir -p "$ANDROID_DIR/app"
          touch "$PROPERTIES"

          # Decode keystore
          echo "Decoding Android keystore..."

          if ! printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "ERROR: Base64 decoding failed."
            exit 1
          fi

          if [[ ! -s "$KEYSTORE_FILE" ]]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          # Validate keystore
          echo "Validating keystore..."

          if ! keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "ERROR: Invalid keystore password or alias."
            exit 1
          fi

          # Remove old signing properties
          sed -i \
            -e '/^MYAPP_UPLOAD_STORE_FILE=/d' \
            -e '/^MYAPP_UPLOAD_STORE_PASSWORD=/d' \
            -e '/^MYAPP_UPLOAD_KEY_ALIAS=/d' \
            -e '/^MYAPP_UPLOAD_KEY_PASSWORD=/d' \
            "$PROPERTIES"

          # Write signing properties
          {
            echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$PROPERTIES"

          # Verify properties
          grep -q '^MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks$' "$PROPERTIES" || {
            echo "ERROR: STORE_FILE property missing."
            exit 1
          }

          grep -q '^MYAPP_UPLOAD_STORE_PASSWORD=.' "$PROPERTIES" || {
            echo "ERROR: STORE_PASSWORD property missing."
            exit 1
          }

          grep -q '^MYAPP_UPLOAD_KEY_ALIAS=.' "$PROPERTIES" || {
            echo "ERROR: KEY_ALIAS property missing."
            exit 1
          }

          grep -q '^MYAPP_UPLOAD_KEY_PASSWORD=.' "$PROPERTIES" || {
            echo "ERROR: KEY_PASSWORD property missing."
            exit 1
          }

          echo "SUCCESS: Android signing configured and verified."

      # 7. Build Android AAB
      - name: Build Android AAB
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease

      # 8. Upload AAB as GitHub artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # 9. Upload AAB directly to Google Play
      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.irshadvali.valcalc
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
