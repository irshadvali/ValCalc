
name: Android Build and Google Play Upload

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android AAB and Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Generate Android project if missing
      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          fi

          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project ready."

      # 6. Configure Android signing
      - name: Configure Android signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          # Validate secrets
          test -n "$KEYSTORE" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: ANDROID_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: ANDROID_KEY_PASSWORD is missing"
            exit 1
          }

          # Create keystore in android/app
          mkdir -p android/app

          printf '%s' "$KEYSTORE" |
            base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          # Validate keystore and alias
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Keystore successfully decoded and verified."

          # Create/update Android root Gradle properties
          touch android/gradle.properties

          sed -i '/^MYAPP_UPLOAD_STORE_FILE=/d' android/gradle.properties
          sed -i '/^MYAPP_UPLOAD_STORE_PASSWORD=/d' android/gradle.properties
          sed -i '/^MYAPP_UPLOAD_KEY_ALIAS=/d' android/gradle.properties
          sed -i '/^MYAPP_UPLOAD_KEY_PASSWORD=/d' android/gradle.properties

          {
            echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

          echo "Android signing properties configured."

      # 7. Verify Android signing
      - name: Verify Android signing
        run: |
          set -euo pipefail

          echo "Checking android/gradle.properties..."

          test -f android/gradle.properties

          grep -q '^MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks$' \
            android/gradle.properties

          grep -q '^MYAPP_UPLOAD_STORE_PASSWORD=' \
            android/gradle.properties

          grep -q '^MYAPP_UPLOAD_KEY_ALIAS=' \
            android/gradle.properties

          grep -q '^MYAPP_UPLOAD_KEY_PASSWORD=' \
            android/gradle.properties

          test -s android/app/upload-keystore.jks

          echo "OK: STORE_FILE property exists"
          echo "OK: STORE_PASSWORD property exists"
          echo "OK: KEY_ALIAS property exists"
          echo "OK: KEY_PASSWORD property exists"
          echo "OK: Keystore file exists"
          echo "Android signing verification successful."

      # 8. Build release AAB
      - name: Build Android AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease

      # 9. Verify AAB
      - name: Verify generated AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "ERROR: AAB file not generated"
            exit 1
          fi

          ls -lh "$AAB"
          echo "AAB generated successfully."

      # 10. Save AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # 11. Upload to Google Play Internal testing
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.irshadvali.valcalc
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed